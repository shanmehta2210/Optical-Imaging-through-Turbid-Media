[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turbid-mc"
version = "0.1.0"
description = "Monte Carlo photon transport for imaging through milk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
    "pandas",
    "pyyaml",
    "tqdm",
    "miepython",
    "imageio",
    "tifffile",
    "rawpy",
]

[project.optional-dependencies]
dev = ["pytest"]
pmcx = ["pmcx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
