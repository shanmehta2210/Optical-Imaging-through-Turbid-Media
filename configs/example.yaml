# Example photon-transport run. Lengths are millimetres, optical
# coefficients are mm^-1, and angles are radians.
# Either medium.g or medium.mu_s_prime is enough. If both are set they
# must agree: g = 1 - mu_s_prime / mu_s.

tank:
  length_mm: 40.0
  width_mm: 50.0
  height_mm: 80.0
  n_medium: 1.33
  n_outside: 1.0

medium:
  mu_a: 1.0e-4
  mu_s: 0.5
  mu_s_prime: 0.05
  g: 0.9

source:
  type: pencil
  x_mm: 0.0
  y_mm: 0.0
  x_half_width_mm: 10.0
  y_half_height_mm: 10.0

rod:
  enabled: false
  radius_mm: 2.0
  x_mm: 0.0
  z_mm: 20.0

detector:
  acceptance_half_angle_rad: 0.05
  lateral_x_min_mm: -20.0
  lateral_x_max_mm: 20.0
  lateral_n_bins: 200
  radial_rho_max_mm: 20.0
  radial_n_bins: 100

simulation:
  n_photons: 100000
  n_batches: 10
  seed: 1
  weight_threshold: 1.0e-4
  roulette_survival: 0.1
